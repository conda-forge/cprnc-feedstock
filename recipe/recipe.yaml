context:
  name: cprnc
  version: "1.1.5"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/ESMCI/cprnc/archive/v${{ version }}.tar.gz
  sha256: f0af5f4180bc93ebac799aa8792d1129c370138ef1fb782d4ecebcd6a71da688

build:
  skip:
    - win
  number: 0

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('fortran') }}
    - ${{ stdlib('c') }}
    - cmake
    - ninja
    - pkg-config
  host:
    - netcdf-fortran

tests:
  - files:
      source:
        - run_tests
        - test_inputs/
    requirements:
      run:
        - perl
    script:
      - ./run_tests -outdir test_outputs

about:
  homepage: https://github.com/ESMCI/cprnc
  summary: Fortran Utility to compare netcdf files.
  description: |
    cprnc is a generic tool for analyzing a netcdf file or comparing two netcdf
    files.
  license: BSD-3-Clause
  license_file: LICENSE.TXT
  documentation: https://github.com/ESMCI/cprnc/README.md
  repository: https://github.com/ESMCI/cprnc

extra:
  recipe-maintainers:
    - xylar
    - andrewdnolan
